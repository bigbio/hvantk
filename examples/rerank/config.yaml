# Example configuration for `hvantk rerank`.
#
# Paths are resolved relative to the PROCESS WORKING DIRECTORY, not to this file, so run
# the command from the repository root (see README.md).
#
# The data under data/ is synthetic and regenerated by make_fixtures.py.

name: rerank-example

# The external cohort declaration: a path to a cohort manifest YAML (see
# hvantk/algorithms/cohort/spec.py and data/cohort.yaml). The manifest is the single
# source of the starting ranking to be re-ranked -- its `prior.column` is carried
# through to the output as `prior_stat`; it is not a model feature. There is no
# separate `prior:` block here; the manifest supersedes it.
#
# When the manifest declares a `cohort_axes` entry naming `n_case_var`, `conc` and
# `driver_af`, the CLI wires up the advisory CaseControlArchitectureAudit
# automatically; a manifest without those columns runs with NoAudit instead.
cohort: examples/rerank/data/cohort.yaml

# Evidence axes. Order matters: the first axis is the ablation baseline the Evaluator
# scores the others against. Every non-key column becomes a model feature and must be
# numeric -- a stray text column is coerced to all-NaN silently.
features:
  - name: constraint
    path: examples/rerank/data/constraint.tsv
  - name: expression
    path: examples/rerank/data/expression.tsv

# External positive set used as the training label. Not derived from the prior, to keep
# the evaluation from being circular.
labels:
  path: examples/rerank/data/labels.txt
