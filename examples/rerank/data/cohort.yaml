# Cohort manifest for the rerank example.
#
# The prior statistic (`minp`) and the case/control architecture columns
# (`n_case_var`, `conc`, `driver_af`) live in a SINGLE table -- data/cohort.tsv,
# generated by make_fixtures.py -- because a cohort manifest can only declare one
# gene-level table (see the parent README.md).
name: rerank-example
key: symbol
key_column: gene
table: examples/rerank/data/cohort.tsv
prior:
  column: minp
  direction: lower_is_better
cohort_axes:
  - axis: architecture
    columns: [n_case_var, conc, driver_af]
