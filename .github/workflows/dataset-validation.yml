name: Dataset Validation Registry Update

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_revalidate:
        description: 'Force revalidation of all datasets'
        required: false
        default: false
        type: boolean
      dataset_filter:
        description: 'Specific dataset to validate (leave empty for all)'
        required: false
        type: string
      max_datasets:
        description: 'Maximum number of datasets to validate'
        required: false
        default: '50'
        type: string
  pull_request: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dataset-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tabix

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Create validation directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dataset_validation_results/{downloads,samples,logs}

      - name: Run UCSC dataset validation
        id: ucsc_validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "🔬 Validating UCSC datasets..."
          python -m hvantk.commands.dataset_validation_cli validate-datasets \
            --ucsc-datasets "${{ github.event.inputs.dataset_filter || 'all' }}" \
            --work-dir ./dataset_validation_results \
            --registry-file ./dataset_validation_results/validation_registry.json \
            --max-datasets "${{ github.event.inputs.max_datasets || '50' }}" \
            --force-revalidate ${{ github.event.inputs.force_revalidate || false }} \
            --verbose 2>&1 | tee dataset_validation_results/logs/ucsc_validation.log
          # Ensure failure bubbles despite tee (read PIPESTATUS immediately)
          code="${PIPESTATUS[0]}"; exit "$code"

      - name: Run Expression Atlas dataset validation
        id: atlas_validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "🧪 Validating Expression Atlas datasets..."
          python -m hvantk.commands.dataset_validation_cli validate-datasets \
            --expression-atlas-datasets "${{ github.event.inputs.dataset_filter || 'all' }}" \
            --work-dir ./dataset_validation_results \
            --registry-file ./dataset_validation_results/validation_registry.json \
            --max-datasets "${{ github.event.inputs.max_datasets || '50' }}" \
            --force-revalidate ${{ github.event.inputs.force_revalidate || false }} \
            --verbose 2>&1 | tee dataset_validation_results/logs/atlas_validation.log
          code="${PIPESTATUS[0]}"; exit "$code"

      - name: Generate validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "📊 Generating validation summary..."
          if [ -f "scripts/generate_validation_summary.py" ]; then
            chmod +x scripts/generate_validation_summary.py
            python scripts/generate_validation_summary.py
          else
            echo "Validation summary script not found, skipping..."
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            dataset_validation_results/
          retention-days: 30

      - name: Comment validation summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('validation_summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              core.warning('Could not read validation summary: ' + error.message);
            }

      - name: Create validation failure issue
        if: failure() && (steps.ucsc_validation.outcome == 'failure' || steps.atlas_validation.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Validation pipeline failed. Check workflow logs for details.';
            try {
              summary = fs.readFileSync('validation_summary.md', 'utf8');
            } catch (error) {
              core.warning('Could not read validation summary');
            }
            
            const title = 'Dataset Validation Failed - ' + new Date().toISOString().split('T')[0];
            const body = summary + '\n\n**Workflow Run:** ' + context.payload.repository.html_url + '/actions/runs/' + context.runId + '\n**Logs:** Check the workflow run for detailed error logs.\n\nThis issue was automatically created by the validation pipeline.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['validation', 'automation', 'bug']
            });
