# File: .github/workflows/dataset-validation.yml
name: Dataset Validation Registry Update

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_revalidate:
        description: 'Force revalidation of all datasets'
        required: false
        default: false          # boolean, not a string
        type: boolean
      dataset_filter:
        description: 'Specific dataset to validate (leave empty for all)'
        required: false
        type: string
      max_datasets:
        description: 'Maximum number of datasets to validate'
        required: false
        default: '50'
        type: string
  pull_request: {}              # Enables PR comment step below

permissions:
  contents: write               # needed for gh-pages push and artifact upload
  issues: write                 # needed to open failure issues
  pull-requests: write          # needed to comment on PRs

concurrency:
  group: dataset-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tabix bgzip

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Create validation directories
        run: |
          set -euo pipefail
          mkdir -p dataset_validation_results/{downloads,samples,logs}
          mkdir -p docs/registry

      - name: Run UCSC dataset validation
        id: ucsc_validation
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "🔬 Validating UCSC datasets..."
          python -m hvantk.commands.dataset_validation_cli validate-datasets \
            --ucsc-datasets "${{ github.event.inputs.dataset_filter || 'all' }}" \
            --work-dir ./dataset_validation_results \
            --registry-file ./dataset_validation_results/validation_registry.json \
            --max-datasets "${{ github.event.inputs.max_datasets || '50' }}" \
            --force-revalidate ${{ github.event.inputs.force_revalidate || false }} \
            --verbose 2>&1 | tee dataset_validation_results/logs/ucsc_validation.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Run Expression Atlas dataset validation
        id: atlas_validation
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "🧪 Validating Expression Atlas datasets..."
          python -m hvantk.commands.dataset_validation_cli validate-datasets \
            --expression-atlas-datasets "${{ github.event.inputs.dataset_filter || 'all' }}" \
            --work-dir ./dataset_validation_results \
            --registry-file ./dataset_validation_results/validation_registry.json \
            --max-datasets "${{ github.event.inputs.max_datasets || '50' }}" \
            --force-revalidate ${{ github.event.inputs.force_revalidate || false }} \
            --verbose 2>&1 | tee dataset_validation_results/logs/atlas_validation.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Generate web registry and API endpoints
        run: |
          set -euo pipefail
          echo "🌐 Generating complete registry interface..."
          python -m hvantk.commands.registry_cli complete \
            --input ./dataset_validation_results/validation_registry.json \
            --output ./docs/registry

      - name: Create status badge
        run: |
          set -euo pipefail
          echo "🏷️ Creating status badge..."
          python - <<'PY'
import sys
from pathlib import Path
sys.path.insert(0, str(Path.cwd()))
from hvantk.register import RegistryManager

manager = RegistryManager("./dataset_validation_results/validation_registry.json")
stats = manager.get_registry_statistics()

rate = stats.get("success_rate", 0)
successful = stats.get("successful", 0)
total = stats.get("total_datasets", 0)
print(f"Success Rate: {rate}% ({successful}/{total})")

Path("./docs/registry").mkdir(parents=True, exist_ok=True)
with open("./docs/registry/status.txt", "w") as f:
    f.write(str(rate))
PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            dataset_validation_results/
            docs/registry/
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/registry
          publish_branch: gh-pages
          commit_message: "🚀 Update dataset validation registry - ${{ github.run_number }}"

      - name: Generate validation summary
        if: always()
        run: |
          set -euo pipefail
          echo "📊 Generating validation summary..."
          python - <<'PY'
import sys, os
from pathlib import Path
from datetime import datetime
sys.path.insert(0, str(Path.cwd()))
try:
    from hvantk.register import RegistryManager
    manager = RegistryManager("./dataset_validation_results/validation_registry.json")
    stats = manager.get_registry_statistics()
    failed_datasets = manager.get_failed_datasets(5)
except Exception:
    stats = {"total_datasets": 0, "successful": 0, "failed": 0, "success_rate": 0.0}
    failed_datasets = []

run_id = os.environ.get("GITHUB_RUN_NUMBER", "unknown")
timestamp = datetime.utcnow().isoformat() + "Z"

lines = []
lines.append("## Dataset Validation Summary 📊")
lines.append("")
lines.append(f"**Run ID:** {run_id}")
lines.append(f"**Timestamp:** {timestamp}")
lines.append("")
lines.append("### Overall Results")
lines.append(f"- 📈 **Total Datasets:** {stats.get('total_datasets', 0)}")
lines.append(f"- ✅ **Successful:** {stats.get('successful', 0)} ({stats.get('success_rate', 0)}%)")
lines.append(f"- ❌ **Failed:** {stats.get('failed', 0)}")

by_status = stats.get("by_status") or {}
if by_status:
    lines.append("")
    lines.append("### Status Breakdown")
    for status, count in sorted(by_status.items()):
        emoji = "✅" if "passed" in status else ("❌" if "failed" in status else "⚪")
        status_title = status.replace("_", " ").title()
        lines.append(f"- {emoji} **{status_title}:** {count}")

if failed_datasets:
    lines.append("")
    lines.append(f"### Recent Failures ({len(failed_datasets)})")
    for failure in failed_datasets:
        err = (failure.get("error_message") or "")[:100]
        if len(failure.get("error_message") or "") > 100:
            err += "..."
        lines.append(f"- **{failure.get('dataset_id','unknown')}** ({failure.get('status','unknown')}): {err}")

with open("validation_summary.md", "w") as f:
    f.write("\n".join(lines))
print("✅ Validation summary generated")
PY

      - name: Comment validation summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('validation_summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              core.warning(`Could not read validation summary: ${error.message}`);
            }

      - name: Create validation failure issue
        if: failure() && (steps.ucsc_validation.outcome == 'failure' || steps.atlas_validation.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Validation pipeline failed. Check workflow logs for details.';
            try {
              summary = fs.readFileSync('validation_summary.md', 'utf8');
            } catch (error) {
              core.warning('Could not read validation summary');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Dataset Validation Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `${summary}

**Workflow Run:** ${context.payload.repository.html_url}/actions/runs/${context.runId}
**Logs:** Check the workflow run for detailed error logs.

This issue was automatically created by the validation pipeline.`,
              labels: ['validation', 'automation', 'bug']
            });
