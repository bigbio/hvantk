name: Dataset Validation Registry Update

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'Validation mode'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full
          - metadata-only
      force_revalidate:
        description: 'Force revalidation of all datasets'
        required: false
        default: false
        type: boolean
      dataset_filter:
        description: 'Specific dataset to validate (leave empty for all)'
        required: false
        type: string
      max_datasets:
        description: 'Maximum number of datasets to validate'
        required: false
        default: '10'
        type: string
  pull_request: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dataset-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tabix

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Create validation directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dataset_validation_results/{downloads,samples,logs}

      - name: Determine validation strategy
        id: strategy
        shell: bash
        run: |
          set -euo pipefail
          
          # Determine validation mode based on trigger and inputs
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=metadata-only" >> $GITHUB_OUTPUT
            echo "max_datasets=3" >> $GITHUB_OUTPUT
            echo "datasets=cortex-dev,zeisel2015,E-MTAB-5061" >> $GITHUB_OUTPUT
            echo "reason=PR validation - testing code changes only" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "mode=quick" >> $GITHUB_OUTPUT
            echo "max_datasets=10" >> $GITHUB_OUTPUT
            echo "datasets=all" >> $GITHUB_OUTPUT
            echo "reason=Scheduled run - monitoring dataset health" >> $GITHUB_OUTPUT
          else
            # Manual workflow_dispatch
            echo "mode=${{ github.event.inputs.validation_mode || 'quick' }}" >> $GITHUB_OUTPUT
            echo "max_datasets=${{ github.event.inputs.max_datasets || '10' }}" >> $GITHUB_OUTPUT
            echo "datasets=${{ github.event.inputs.dataset_filter || 'all' }}" >> $GITHUB_OUTPUT
            echo "reason=Manual run - user requested validation" >> $GITHUB_OUTPUT
          fi

      - name: Display validation plan
        shell: bash
        run: |
          echo "🎯 Validation Strategy:"
          echo "  Mode: ${{ steps.strategy.outputs.mode }}"
          echo "  Max datasets: ${{ steps.strategy.outputs.max_datasets }}"
          echo "  Datasets: ${{ steps.strategy.outputs.datasets }}"
          echo "  Reason: ${{ steps.strategy.outputs.reason }}"
          echo ""
          
          case "${{ steps.strategy.outputs.mode }}" in
            "metadata-only")
              echo "📋 Metadata-only validation:"
              echo "  ✓ Check dataset availability"
              echo "  ✓ Validate catalog integrity"
              echo "  ✓ Test CLI functionality"
              echo "  ✗ No data downloads"
              echo "  ⚡ Fast execution (~2-5 minutes)"
              ;;
            "quick")
              echo "🚀 Quick validation:"
              echo "  ✓ Download sample data only"
              echo "  ✓ Header validation (Tier 1)"
              echo "  ✓ Limited sample validation"
              echo "  📊 Moderate data usage (~500MB-2GB)"
              echo "  ⏱️  Medium execution (~10-20 minutes)"
              ;;
            "full")
              echo "🔍 Full validation:"
              echo "  ✓ Complete data downloads"
              echo "  ✓ All validation tiers"
              echo "  ✓ Comprehensive testing"
              echo "  💾 High data usage (5GB+)"
              echo "  ⏳ Long execution (~30-60 minutes)"
              ;;
          esac

      - name: Run dataset validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          
          # Build base command
          cmd="python -m hvantk.commands.dataset_validation_cli validate-datasets \
            --work-dir ./dataset_validation_results \
            --registry-file ./dataset_validation_results/validation_registry.json \
            --max-datasets ${{ steps.strategy.outputs.max_datasets }} \
            --verbose"
          
          # Add mode-specific flags
          case "${{ steps.strategy.outputs.mode }}" in
            "metadata-only")
              cmd="$cmd --quick-validation"
              # For metadata-only, we'll just test a few known datasets
              cmd="$cmd --ucsc-datasets cortex-dev zeisel2015"
              ;;
            "quick")
              cmd="$cmd --sample-lines 50"  # Reduced sample size
              if [[ "${{ steps.strategy.outputs.datasets }}" == "all" ]]; then
                cmd="$cmd --ucsc-datasets all"
              else
                cmd="$cmd --ucsc-datasets ${{ steps.strategy.outputs.datasets }}"
              fi
              ;;
            "full")
              if [[ "${{ steps.strategy.outputs.datasets }}" == "all" ]]; then
                cmd="$cmd --ucsc-datasets all --expression-atlas-datasets all"
              else
                cmd="$cmd --ucsc-datasets ${{ steps.strategy.outputs.datasets }}"
              fi
              ;;
          esac
          
          # Add force revalidate if requested
          if [[ "${{ github.event.inputs.force_revalidate }}" == "true" ]]; then
            cmd="$cmd --force-revalidate"
          fi
          
          echo "🚀 Executing: $cmd"
          echo ""
          
          # Execute validation and capture results
          eval "$cmd" 2>&1 | tee dataset_validation_results/logs/validation.log
          exit_code="${PIPESTATUS[0]}"
          
          echo "validation_exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit "$exit_code"

      - name: Generate validation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "📊 Generating validation summary..."
          if [ -f "scripts/generate_validation_summary.py" ]; then
            chmod +x scripts/generate_validation_summary.py
            python scripts/generate_validation_summary.py
          else
            echo "Validation summary script not found, skipping..."
          fi

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            dataset_validation_results/
          retention-days: 30

      - name: Comment validation summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('validation_summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              core.warning('Could not read validation summary: ' + error.message);
            }

      - name: Create validation failure issue
        if: failure() && (steps.ucsc_validation.outcome == 'failure' || steps.atlas_validation.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Validation pipeline failed. Check workflow logs for details.';
            try {
              summary = fs.readFileSync('validation_summary.md', 'utf8');
            } catch (error) {
              core.warning('Could not read validation summary');
            }
            
            const title = 'Dataset Validation Failed - ' + new Date().toISOString().split('T')[0];
            const body = summary + '\n\n**Workflow Run:** ' + context.payload.repository.html_url + '/actions/runs/' + context.runId + '\n**Logs:** Check the workflow run for detailed error logs.\n\nThis issue was automatically created by the validation pipeline.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['validation', 'automation', 'bug']
            });

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/registry
