name: Scheduled drift check

on:
  schedule:
    # Fortnightly, 06:00 UTC on the 1st and 15th. Nothing upstream moves faster than
    # weekly in a way that matters: GWAS Catalog is ~monthly, GTEx moved twice in four
    # months, ClinVar/GenCC/UCSC are weekly. Probe HEALTH is checked weekly by
    # drift-health.yml, which opens no PRs.
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run the helper in --dry-run mode (no git/gh side effects)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  # The actual branch push and PR creation authenticate with the drift-bot
  # GitHub App token (see the "Mint drift-bot token" step), not this
  # GITHUB_TOKEN: a PR authored by GITHUB_TOKEN has its workflow runs parked
  # at conclusion `action_required` until a human manually approves them, so
  # CI never runs unattended on a GITHUB_TOKEN-authored drift PR. The App
  # token is exempt from that restriction. contents/pull-requests write is
  # still needed here for actions/checkout and other steps that use the
  # job's default GITHUB_TOKEN. No id-token / packages permissions are needed.
  contents: write
  pull-requests: write

env:
  # Base branch the bot branches off of and targets PRs against. Override here
  # once the refactor lands on dev/main.
  BASE_BRANCH: dev

jobs:
  drift:
    runs-on: ubuntu-latest
    # Schedule events on forks run with the upstream token but we still want to
    # be defensive: only run on the canonical repo to avoid surprise pushes
    # from fork-triggered manual dispatches.
    if: github.repository == 'bigbio/hvantk' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Mint drift-bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DRIFT_BOT_APP_ID }}
          private-key: ${{ secrets.DRIFT_BOT_PRIVATE_KEY }}

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Need history + branches for the helper to create new branches and
          # push them. fetch-depth: 0 keeps things simple at the cost of size.
          fetch-depth: 0
          ref: ${{ env.BASE_BRANCH }}

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Add conda to system path
        run: |
          echo $CONDA/bin >> $GITHUB_PATH

      - name: Install dependencies via conda env
        run: |
          conda env update --file environment.yml --name base

      # The `ptm` extra, not a bare install. The cptac probe fingerprints the INSTALLED
      # cptac version (importlib.metadata) against PayneLab's latest GitHub release, so
      # the package has to be present for the probe to mean anything -- and `cptac` is
      # declared in the `ptm` extra. Under a bare `pip install -e .` both cptac:expression
      # and cptac:phospho raised "The 'cptac' Python package is not installed; cannot
      # fingerprint" on EVERY run, so upstream CPTAC drift has never once been detectable.
      # Of the 22 probes these two are the only ones needing an extra; the other 20 use
      # requests or the stdlib alone.
      - name: Install hvantk in development mode
        run: |
          pip install -e ".[ptm]"

      - name: Configure git author for bot commits
        run: |
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run drift check (capture JSON)
        # Tolerate non-zero exits: drift_cli returns 1 on drifted, 2 on
        # probe_failed. Those are signals, not failures.
        run: |
          set +e
          python -m hvantk.hvantk drift --all --json > /tmp/drift_report.json
          rc=$?
          echo "drift exit code: $rc"
          if [ $rc -gt 2 ]; then
            echo "drift CLI exited with $rc (unexpected; treating as failure)" >&2
            exit $rc
          fi
          exit 0

      - name: Show drift report
        run: |
          echo "--- /tmp/drift_report.json ---"
          cat /tmp/drift_report.json || true

      - name: Open / update draft PRs per drifted dataset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DRIFT_DEFAULT_ASSIGNEE: enriquea
        run: |
          ARGS="--report /tmp/drift_report.json --base-branch ${BASE_BRANCH}"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python .github/scripts/drift_to_pr.py $ARGS
