name: Python Package using Conda

on: [push]

jobs:
  # Runs in seconds and needs no environment, so it sits in the workflow that triggers on
  # every push rather than only on main-targeted PRs. Its absence is why poetry.lock drifted
  # out of sync with pyproject.toml across ~28 commits without CI noticing: nothing in the
  # pipeline installed via poetry or validated the lock, so the two could disagree forever
  # while every job stayed green.
  lockfile:
    name: poetry.lock in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      # Pinned to the 2.x line rather than latest: pyproject.toml still uses the
      # `[tool.poetry.*]` spelling of keywords/urls/plugins/extras/scripts, which 2.x
      # reports as deprecation warnings (exit 0). A future major is entitled to promote
      # those to errors, which would break this gate on someone else's release rather
      # than on a change of ours.
      - name: Install poetry
        run: python -m pip install --upgrade pip "poetry>=2.0,<3.0"
      - name: Check pyproject.toml is valid and poetry.lock matches it
        run: poetry check --lock

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4
      - name: Install OpenBLAS
        run: |
            sudo apt-get update
            sudo apt-get install -y libopenblas-dev
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Add conda to system path
        run: |
          # $CONDA is an environment variable pointing to the root of the miniconda directory
          echo $CONDA/bin >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          conda env update --file environment.yml --name base
      - name: Lint with flake8
        run: |
          python -m pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: |
          python -m pip install pytest
          pytest

  # The `hail` marker is deselected by pytest.ini's addopts, so before this job the
  # plugin-contract tests had never run in CI. That is how test_plugin_smoke's expected
  # provider list drifted 8 providers behind the tree, and how three builder/streamer
  # bugs stayed green. Scoped to the contract tests (~2 min) rather than the whole `hail`
  # suite (~31 min, dominated by unrelated HGC/ancestry integration work) so it is cheap
  # enough to run on every push.
  plugin-contract:
    name: Plugin contract (hail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
      # Hail requires Java 11; the runner's default JDK will fail at hl.init().
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Add conda to system path
        run: |
          echo $CONDA/bin >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          conda env update --file environment.yml --name base
      # requests-mock is a dev-group dependency; without it the 12 test_drift_probe
      # modules fail to import and pytest aborts the whole run on collection errors.
      - name: Install test dependencies
        run: |
          python -m pip install pytest requests-mock
      - name: Run plugin contract tests
        run: |
          pytest hvantk/tests/test_plugin_smoke.py \
                 hvantk/tests/test_plugin_conformance.py \
                 hvantk/tests/test_hail_helpers.py \
                 hvantk/skills \
                 -m hail -rA
