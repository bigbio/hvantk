name: Weekly drift probe health

# Runs the probes and opens NO PRs. Fortnightly regeneration doubles the worst-case
# delay on a BROKEN probe, and cptac's probe failed silently for months before anyone
# noticed (see #268), so probe health is checked on its own faster cadence. Cheap:
# these are HTTP HEADs.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    if: github.repository == 'bigbio/hvantk' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e ".[ptm]"

      - name: Probe every dataset
        run: |
          set +e
          python -m hvantk.hvantk drift --all --json > /tmp/health.json
          rc=$?
          echo "drift exit code: $rc"
          if [ $rc -gt 2 ]; then exit $rc; fi
          exit 0

      - name: Open or update an issue if any probe failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          failed=$(python3 -c "
          import json
          r = json.load(open('/tmp/health.json'))
          rows = r if isinstance(r, list) else r.get('results', [])
          # key is dataset_name (DriftResult / dataclasses.asdict), NOT dataset
          print('\n'.join(sorted(
              x['dataset_name'] for x in rows if x.get('status') == 'probe_failed')))
          ")
          if [ -z "$failed" ]; then
            echo "all probes healthy"
            exit 0
          fi
          echo "probe_failed: $failed"
          body=$(printf 'These drift probes are failing:\n\n```\n%s\n```\n\nA failing probe reports neither clean nor drifted, so upstream changes for these datasets are invisible until it is fixed.' "$failed")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label "drift:probe-failed" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Drift probes failing" --label "drift:probe-failed" --body "$body"
          fi
