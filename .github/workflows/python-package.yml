# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

# `dev` is included deliberately. With main-only triggers the 3.10/3.11/3.12 matrix ran for
# the first time at the release gate, so a version incompatibility introduced on a dev PR was
# discovered with a whole release to bisect instead of a single commit. The cost is three jobs
# per dev PR; the alternative is finding out later, on a bigger diff.
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

# lint + test only; no write scopes needed
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --output-format=full
          # exit-zero treats all errors as warnings; width/complexity come from pyproject.toml
          ruff check . --exit-zero --statistics
      - name: Test with pytest
        run: |
          pytest

      - name: Build docs (strict)
        # The Deploy-docs workflow runs only on push to main and without
        # --strict, so nothing checked the docs on a pull request. This does,
        # and it is where a broken anchor or dead internal link surfaces.
        run: |
          python -m pip install mkdocs-material
          mkdocs build --strict --site-dir /tmp/site-check
