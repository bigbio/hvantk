# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel a superseded PR run so it stops competing for runners; never cancel a run on
# main, where `github.event.pull_request.number` is unset and the group key falls back
# to the ref (#432).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.16,<0.17" pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --output-format=full
          # formatting is enforced too: fails if `ruff format .` would change any file
          ruff format --check .
          # exit-zero treats all errors as warnings; --preview restores the pycodestyle
          # whitespace rules ruff keeps behind preview; selection/width/complexity come
          # from pyproject.toml
          ruff check . --exit-zero --statistics --preview
      - name: Test with pytest
        run: |
          # --require-round-trips fails the run if a @pytest.mark.round_trip(...) test
          # (the 4 non-hail ones run in this default selection) ends skipped or xfailed,
          # which a static check cannot see (#432).
          pytest --require-round-trips
