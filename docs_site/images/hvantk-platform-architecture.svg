<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">hvantk platform architecture — four-layer data-model platform</title>
  <desc id="desc">tools/, skills/, and algorithms/ layers depend on core/; skills/ and tools/ also depend on algorithms/. The one-way dependency rule is enforced by test_dependency_directions.py.</desc>

  <!-- Definitions: gradients, drop shadow, arrowhead -->
  <defs>
    <linearGradient id="g-tools" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="g-skills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="g-algo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="g-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arr-tools" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-skills" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-algo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">hvantk — four-layer data-model platform</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">one-way dependency rule enforced by tests/test_dependency_directions.py</text>

  <!-- ==================== Tools layer ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="86" width="880" height="120" rx="14" fill="url(#g-tools)" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="56" y="110" font-size="13" font-weight="700" fill="#1e3a8a" letter-spacing="0.4">TOOLS &nbsp; <tspan font-weight="400" font-size="12" fill="#1e3a8a" opacity="0.7">CLI + workflow orchestration</tspan></text>

  <!-- Tools components -->
  <g font-size="11" fill="#1e3a8a">
    <rect x="60"  y="124" width="190" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="155" y="144" text-anchor="middle">reprocess / drift / catalog</text>

    <rect x="270" y="124" width="190" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="365" y="144" text-anchor="middle">download (manifest-driven)</text>

    <rect x="480" y="124" width="190" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="575" y="144" text-anchor="middle">hgc, ancestry, enrichex, ...</text>

    <rect x="690" y="124" width="210" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="795" y="144" text-anchor="middle">mktable / mkmatrix (deprecated)</text>

    <rect x="60"  y="166" width="190" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="155" y="186" text-anchor="middle">psroc / qtlcascade / ptm</text>

    <rect x="270" y="166" width="190" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="365" y="186" text-anchor="middle">expression / genesets</text>

    <rect x="480" y="166" width="420" height="32" rx="6" fill="#ffffffbb" stroke="#2563eb" stroke-width="1"/>
    <text x="690" y="186" text-anchor="middle">plugins / tools registry, drift_runner, mktable-batch (registry-driven)</text>
  </g>

  <!-- ==================== Skills layer ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="880" height="120" rx="14" fill="url(#g-skills)" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <text x="56" y="254" font-size="13" font-weight="700" fill="#92400e" letter-spacing="0.4">SKILLS &nbsp; <tspan font-weight="400" font-size="12" fill="#92400e" opacity="0.7">data-source plugins — 20 today (clinvar, hgnc, gevir, dbnsfp, expression-atlas, cptac, ucsc-cellbrowser, ...)</tspan></text>

  <g font-size="11" fill="#92400e">
    <rect x="60"  y="268" width="200" height="32" rx="6" fill="#ffffffbb" stroke="#d97706" stroke-width="1"/>
    <text x="160" y="288" text-anchor="middle">plugin.yaml manifest</text>

    <rect x="280" y="268" width="200" height="32" rx="6" fill="#ffffffbb" stroke="#d97706" stroke-width="1"/>
    <text x="380" y="288" text-anchor="middle">builder.py → Artifact</text>

    <rect x="500" y="268" width="200" height="32" rx="6" fill="#ffffffbb" stroke="#d97706" stroke-width="1"/>
    <text x="600" y="288" text-anchor="middle">drift_probe.py</text>

    <rect x="720" y="268" width="180" height="32" rx="6" fill="#ffffffbb" stroke="#d97706" stroke-width="1"/>
    <text x="810" y="288" text-anchor="middle">cli.py (downloader)</text>

    <rect x="60"  y="310" width="840" height="32" rx="6" fill="#ffffffbb" stroke="#d97706" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="480" y="330" text-anchor="middle" font-style="italic">Optional lifecycle: download_fn → parse_fn → build_fn — orchestrated by run_builder_for_spec()</text>
  </g>

  <!-- ==================== Algorithms layer ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="374" width="880" height="120" rx="14" fill="url(#g-algo)" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="56" y="398" font-size="13" font-weight="700" fill="#065f46" letter-spacing="0.4">ALGORITHMS &nbsp; <tspan font-weight="400" font-size="12" fill="#065f46" opacity="0.7">analytics — decorated with @algorithm(inputs=..., outputs=..., required_backend=...)</tspan></text>

  <g font-size="11" fill="#065f46">
    <rect x="60"  y="412" width="200" height="32" rx="6" fill="#ffffffbb" stroke="#059669" stroke-width="1"/>
    <text x="160" y="432" text-anchor="middle">ancestry / enrichex</text>

    <rect x="280" y="412" width="200" height="32" rx="6" fill="#ffffffbb" stroke="#059669" stroke-width="1"/>
    <text x="380" y="432" text-anchor="middle">expression / annotation</text>

    <rect x="500" y="412" width="200" height="32" rx="6" fill="#ffffffbb" stroke="#059669" stroke-width="1"/>
    <text x="600" y="432" text-anchor="middle">hgc / ptm</text>

    <rect x="720" y="412" width="180" height="32" rx="6" fill="#ffffffbb" stroke="#059669" stroke-width="1"/>
    <text x="810" y="432" text-anchor="middle">psroc / qtlcascade</text>

    <rect x="60"  y="454" width="840" height="32" rx="6" fill="#ffffffbb" stroke="#059669" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="480" y="474" text-anchor="middle" font-style="italic">@algorithm decorator chains input → output provenance automatically</text>
  </g>

  <!-- ==================== Core layer ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="518" width="880" height="150" rx="14" fill="url(#g-core)" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <text x="56" y="542" font-size="13" font-weight="700" fill="#5b21b6" letter-spacing="0.4">CORE &nbsp; <tspan font-weight="400" font-size="12" fill="#5b21b6" opacity="0.7">platform substrate — the only layer with no upward dependencies</tspan></text>

  <g font-size="11" fill="#5b21b6">
    <rect x="60"  y="556" width="280" height="44" rx="6" fill="#ffffffbb" stroke="#7c3aed" stroke-width="1"/>
    <text x="200" y="574" text-anchor="middle" font-weight="600">models/</text>
    <text x="200" y="591" text-anchor="middle" font-size="10">AnnotationTable, ExpressionMatrix, GeneSet</text>

    <rect x="360" y="556" width="280" height="44" rx="6" fill="#ffffffbb" stroke="#7c3aed" stroke-width="1"/>
    <text x="500" y="574" text-anchor="middle" font-weight="600">io/</text>
    <text x="500" y="591" text-anchor="middle" font-size="10">save · load · save_native · load_native</text>

    <rect x="660" y="556" width="240" height="44" rx="6" fill="#ffffffbb" stroke="#7c3aed" stroke-width="1"/>
    <text x="780" y="574" text-anchor="middle" font-weight="600">plugin/</text>
    <text x="780" y="591" text-anchor="middle" font-size="10">registry · run_builder_for_spec</text>

    <rect x="60"  y="610" width="400" height="44" rx="6" fill="#ffffffbb" stroke="#7c3aed" stroke-width="1"/>
    <text x="260" y="628" text-anchor="middle" font-weight="600">Provenance · BuildContext</text>
    <text x="260" y="645" text-anchor="middle" font-size="10">required field on every artifact; parents chain via @algorithm</text>

    <rect x="480" y="610" width="420" height="44" rx="6" fill="#ffffffbb" stroke="#7c3aed" stroke-width="1"/>
    <text x="690" y="628" text-anchor="middle" font-weight="600">Expr DSL — col(...), agg_mean, agg_count, ...</text>
    <text x="690" y="645" text-anchor="middle" font-size="10">compiles to hail or pandas; algorithms write backend-agnostic queries</text>
  </g>

  <!-- ==================== Dependency arrows ==================== -->
  <!-- Tools -> Skills -->
  <path d="M 130 206 L 130 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-tools)" opacity="0.85"/>
  <!-- Tools -> Algorithms (curved around Skills) -->
  <path d="M 400 206 C 400 360, 400 360, 400 374" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-tools)" opacity="0.7" stroke-dasharray="4 3"/>
  <!-- Tools -> Core (curved further) -->
  <path d="M 830 206 C 830 480, 830 480, 830 518" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-tools)" opacity="0.55" stroke-dasharray="4 3"/>

  <!-- Skills -> Algorithms -->
  <path d="M 200 350 L 200 374" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-skills)" opacity="0.85"/>
  <!-- Skills -> Core (curved around Algorithms) -->
  <path d="M 650 350 C 650 490, 650 490, 650 518" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arr-skills)" opacity="0.65" stroke-dasharray="4 3"/>

  <!-- Algorithms -> Core -->
  <path d="M 480 494 L 480 518" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-algo)" opacity="0.85"/>

  <!-- Legend / footer -->
  <g font-size="11" fill="#475569" transform="translate(40, 690)">
    <text>solid arrow = required dependency &nbsp;·&nbsp; dashed arrow = transitive (via the layer in between) &nbsp;·&nbsp; arrows flow downward only</text>
  </g>
</svg>
