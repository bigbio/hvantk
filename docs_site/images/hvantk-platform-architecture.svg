<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">hvantk platform architecture</title>
  <desc id="desc">Four-layer platform: tools/ depends on skills/, algorithms/, and core/; skills/ depends on algorithms/ and core/; algorithms/ depends on core/. Arrows flow downward only and are enforced by tests/test_dependency_directions.py.</desc>

  <defs>
    <linearGradient id="g-tools" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="g-skills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="g-algo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="g-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">hvantk — four-layer data-model platform</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#64748b">one-way dependency rule enforced by tests/test_dependency_directions.py</text>

  <!-- ============== TOOLS band ============== -->
  <g filter="url(#shadow)">
    <rect x="120" y="88" width="780" height="118" rx="14" fill="url(#g-tools)" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <rect x="120" y="88" width="780" height="26" rx="14" fill="#2563eb"/>
  <rect x="120" y="100" width="780" height="14" fill="#2563eb"/>
  <text x="136" y="106" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">TOOLS</text>
  <text x="884" y="106" text-anchor="end" font-size="11.5" fill="#dbeafe">CLI + workflow orchestration</text>

  <g font-size="11.5" fill="#1e3a8a">
    <rect x="138" y="126" width="178" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="227" y="146" text-anchor="middle">reprocess · drift · catalog</text>

    <rect x="324" y="126" width="178" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="413" y="146" text-anchor="middle">download (manifest-driven)</text>

    <rect x="510" y="126" width="178" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="599" y="146" text-anchor="middle">hgc · ancestry · enrichex</text>

    <rect x="696" y="126" width="186" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="789" y="146" text-anchor="middle">psroc · qtlcascade · ptm</text>

    <rect x="138" y="164" width="364" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="320" y="184" text-anchor="middle">expression · genesets · drift_runner</text>

    <rect x="510" y="164" width="372" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="696" y="184" text-anchor="middle" font-style="italic" fill="#475569">mktable / mkmatrix (deprecated)</text>
  </g>

  <!-- ============== SKILLS band ============== -->
  <g filter="url(#shadow)">
    <rect x="120" y="240" width="780" height="118" rx="14" fill="url(#g-skills)" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <rect x="120" y="240" width="780" height="26" rx="14" fill="#d97706"/>
  <rect x="120" y="252" width="780" height="14" fill="#d97706"/>
  <text x="136" y="258" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">SKILLS</text>
  <text x="884" y="258" text-anchor="end" font-size="11.5" fill="#fef3c7">data-source plugins · 20 today (clinvar, hgnc, gevir, dbnsfp, expression-atlas, cptac, …)</text>

  <g font-size="11.5" fill="#92400e">
    <rect x="138" y="278" width="186" height="30" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="231" y="298" text-anchor="middle">plugin.yaml manifest</text>

    <rect x="332" y="278" width="186" height="30" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="425" y="298" text-anchor="middle">builder.py → Artifact</text>

    <rect x="526" y="278" width="178" height="30" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="615" y="298" text-anchor="middle">drift_probe.py</text>

    <rect x="712" y="278" width="170" height="30" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="797" y="298" text-anchor="middle">cli.py (downloader)</text>

    <rect x="138" y="316" width="744" height="30" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="510" y="336" text-anchor="middle" font-style="italic" fill="#475569">Optional lifecycle: download_fn → parse_fn → build_fn — orchestrated by run_builder_for_spec()</text>
  </g>

  <!-- ============== ALGORITHMS band ============== -->
  <g filter="url(#shadow)">
    <rect x="120" y="392" width="780" height="118" rx="14" fill="url(#g-algo)" stroke="#059669" stroke-width="1.5"/>
  </g>
  <rect x="120" y="392" width="780" height="26" rx="14" fill="#059669"/>
  <rect x="120" y="404" width="780" height="14" fill="#059669"/>
  <text x="136" y="410" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">ALGORITHMS</text>
  <text x="884" y="410" text-anchor="end" font-size="11.5" fill="#d1fae5">analytics · @algorithm(inputs=…, outputs=…, required_backend=…)</text>

  <g font-size="11.5" fill="#065f46">
    <rect x="138" y="430" width="178" height="30" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="227" y="450" text-anchor="middle">ancestry · enrichex</text>

    <rect x="324" y="430" width="178" height="30" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="413" y="450" text-anchor="middle">expression · annotation</text>

    <rect x="510" y="430" width="178" height="30" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="599" y="450" text-anchor="middle">hgc · ptm</text>

    <rect x="696" y="430" width="186" height="30" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="789" y="450" text-anchor="middle">psroc · qtlcascade</text>

    <rect x="138" y="468" width="744" height="30" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="510" y="488" text-anchor="middle" font-style="italic" fill="#475569">@algorithm decorator chains input → output provenance automatically</text>
  </g>

  <!-- ============== CORE band ============== -->
  <g filter="url(#shadow)">
    <rect x="120" y="544" width="780" height="156" rx="14" fill="url(#g-core)" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <rect x="120" y="544" width="780" height="26" rx="14" fill="#7c3aed"/>
  <rect x="120" y="556" width="780" height="14" fill="#7c3aed"/>
  <text x="136" y="562" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">CORE</text>
  <text x="884" y="562" text-anchor="end" font-size="11.5" fill="#ede9fe">platform substrate · no upward dependencies</text>

  <g font-size="11.5" fill="#5b21b6">
    <rect x="138" y="582" width="244" height="48" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="260" y="602" text-anchor="middle" font-weight="600">models/</text>
    <text x="260" y="620" text-anchor="middle" font-size="10.5" fill="#6d28d9">AnnotationTable · ExpressionMatrix · GeneSet</text>

    <rect x="390" y="582" width="244" height="48" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="512" y="602" text-anchor="middle" font-weight="600">io/</text>
    <text x="512" y="620" text-anchor="middle" font-size="10.5" fill="#6d28d9">save · load · save_native · load_native</text>

    <rect x="642" y="582" width="240" height="48" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="762" y="602" text-anchor="middle" font-weight="600">plugin/</text>
    <text x="762" y="620" text-anchor="middle" font-size="10.5" fill="#6d28d9">registry · run_builder_for_spec</text>

    <rect x="138" y="638" width="372" height="48" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="324" y="658" text-anchor="middle" font-weight="600">Provenance · BuildContext</text>
    <text x="324" y="676" text-anchor="middle" font-size="10.5" fill="#6d28d9">required on every artifact; chained by @algorithm</text>

    <rect x="518" y="638" width="364" height="48" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="700" y="658" text-anchor="middle" font-weight="600">Expr DSL — col(…), agg_mean, agg_count, …</text>
    <text x="700" y="676" text-anchor="middle" font-size="10.5" fill="#6d28d9">compiles to hail or pandas</text>
  </g>

  <!-- ============== Dependency rail (left side, between bands) ============== -->
  <!-- Three short arrows in the gaps between adjacent bands, all on the same vertical axis -->
  <g>
    <!-- Tools -> Skills -->
    <line x1="80" y1="210" x2="80" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="68" y="226" text-anchor="end" font-size="10.5" fill="#475569">depends on</text>

    <!-- Skills -> Algorithms -->
    <line x1="80" y1="362" x2="80" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="68" y="378" text-anchor="end" font-size="10.5" fill="#475569">depends on</text>

    <!-- Algorithms -> Core -->
    <line x1="80" y1="514" x2="80" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="68" y="530" text-anchor="end" font-size="10.5" fill="#475569">depends on</text>
  </g>

  <!-- Footer legend -->
  <g font-size="11" fill="#64748b">
    <line x1="120" y1="718" x2="146" y2="718" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="156" y="722">direct dependency between adjacent layers</text>

    <text x="884" y="722" text-anchor="end" fill="#64748b">tools/ also imports algorithms/ + core/; skills/ also imports core/ — never upward</text>
  </g>
</svg>
