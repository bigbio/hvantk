<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">hvantk platform architecture</title>
  <desc id="desc">tools/, skills/ and algorithms/ are top-level packages on a shared core/ substrate. tools/ imports skills/ and algorithms/; skills/ and algorithms/ never import each other (or tools/) and meet only through core/. Every package imports core/; nothing imports upward. The rule is enforced by test_dependency_directions.py.</desc>

  <defs>
    <linearGradient id="g-tools" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="g-skills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="g-algo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="g-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">hvantk — layers on a shared core</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">tools/ composes skills/ and algorithms/, which meet only through core/ — enforced by test_dependency_directions.py</text>

  <!-- ============================================================ -->
  <!-- Three peer columns (Tools | Skills | Algorithms)             -->
  <!-- ============================================================ -->

  <!-- ============== TOOLS column ============== -->
  <g filter="url(#shadow)">
    <rect x="50" y="86" width="280" height="240" rx="14" fill="url(#g-tools)" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <rect x="50" y="86" width="280" height="28" rx="14" fill="#2563eb"/>
  <rect x="50" y="100" width="280" height="14" fill="#2563eb"/>
  <text x="64" y="104" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">TOOLS</text>
  <text x="316" y="104" text-anchor="end" font-size="11" fill="#dbeafe">CLI + orchestration</text>

  <g font-size="11.5" fill="#1e3a8a">
    <rect x="64" y="128" width="252" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="190" y="146" text-anchor="middle">reprocess · drift · plugins · catalog</text>

    <rect x="64" y="162" width="252" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="190" y="180" text-anchor="middle">download (manifest-driven) · utils</text>

    <rect x="64" y="196" width="252" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="190" y="214" text-anchor="middle">hgc · ancestry · enrichex · psroc</text>

    <rect x="64" y="230" width="252" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="190" y="248" text-anchor="middle">qtlcascade · ptm · expression</text>

    <rect x="64" y="264" width="252" height="28" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="190" y="282" text-anchor="middle">annotate · cohort · rerank · genesets</text>

    <rect x="64" y="298" width="252" height="20" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="190" y="312" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">lazy-loaded click commands + .tool.yaml</text>
  </g>

  <!-- ============== SKILLS column ============== -->
  <g filter="url(#shadow)">
    <rect x="360" y="86" width="280" height="240" rx="14" fill="url(#g-skills)" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <rect x="360" y="86" width="280" height="28" rx="14" fill="#d97706"/>
  <rect x="360" y="100" width="280" height="14" fill="#d97706"/>
  <text x="374" y="104" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">SKILLS</text>
  <text x="626" y="104" text-anchor="end" font-size="11" fill="#fef3c7">data-source plugins</text>

  <g font-size="11.5" fill="#92400e">
    <rect x="374" y="128" width="252" height="28" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="500" y="146" text-anchor="middle">plugin.yaml manifest</text>

    <rect x="374" y="162" width="252" height="28" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="500" y="180" text-anchor="middle">builder.py → dataset</text>

    <rect x="374" y="196" width="252" height="28" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="500" y="214" text-anchor="middle">drift_probe.py</text>

    <rect x="374" y="230" width="252" height="28" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
    <text x="500" y="248" text-anchor="middle">cli.py (downloader)</text>

    <rect x="374" y="264" width="252" height="28" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="500" y="282" text-anchor="middle" font-style="italic" fill="#475569">download_fn → parse_fn → build_fn</text>

    <rect x="374" y="298" width="252" height="20" rx="6" fill="#fde68a" stroke="#fcd34d" stroke-width="1"/>
    <text x="500" y="312" text-anchor="middle" font-size="10.5" fill="#92400e">clinvar · hgnc · cptac · gevir · dbnsfp · …</text>
  </g>

  <!-- ============== ALGORITHMS column ============== -->
  <g filter="url(#shadow)">
    <rect x="670" y="86" width="280" height="240" rx="14" fill="url(#g-algo)" stroke="#059669" stroke-width="1.5"/>
  </g>
  <rect x="670" y="86" width="280" height="28" rx="14" fill="#059669"/>
  <rect x="670" y="100" width="280" height="14" fill="#059669"/>
  <text x="684" y="104" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">ALGORITHMS</text>
  <text x="936" y="104" text-anchor="end" font-size="11" fill="#d1fae5">analytics</text>

  <g font-size="11.5" fill="#065f46">
    <rect x="684" y="128" width="252" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="810" y="146" text-anchor="middle">ancestry · annotation · burden</text>

    <rect x="684" y="162" width="252" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="810" y="180" text-anchor="middle">cohort · enrichex · expression</text>

    <rect x="684" y="196" width="252" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="810" y="214" text-anchor="middle">hgc · psroc · ptm</text>

    <rect x="684" y="230" width="252" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="810" y="248" text-anchor="middle">qtlcascade · rerank</text>

    <rect x="684" y="264" width="252" height="28" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/>
    <text x="810" y="282" text-anchor="middle">statistics · visualization</text>

    <rect x="684" y="298" width="252" height="20" rx="6" fill="#a7f3d0" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="810" y="312" text-anchor="middle" font-size="10.5" font-style="italic" fill="#065f46">@algorithm(backends, inputs, outputs)</text>
  </g>

  <!-- ============================================================ -->
  <!-- Lateral dependencies: Tools->Skills between the columns,       -->
  <!-- Tools->Algorithms as an arc above them, and no import between  -->
  <!-- Skills and Algorithms (they meet only through core/)           -->
  <!-- ============================================================ -->

  <!-- Tools -> Skills (between columns, mid-band) -->
  <line x1="332" y1="206" x2="358" y2="206" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="200" text-anchor="middle" font-size="9.5" fill="#475569">imports</text>

  <!-- Tools -> Algorithms (arc above the Skills column) -->
  <path d="M 250 86 Q 500 50 750 86" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="81" text-anchor="middle" font-size="9.5" fill="#475569">imports</text>

  <!-- Skills x Algorithms: no import in either direction -->
  <path d="M649,200 L661,212 M661,200 L649,212" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ============================================================ -->
  <!-- Down arrows from each peer to Core                           -->
  <!-- ============================================================ -->
  <line x1="190" y1="332" x2="190" y2="394" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="500" y1="332" x2="500" y2="394" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="810" y1="332" x2="810" y2="394" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="500" y="360" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">all three layers depend on core/</text>

  <!-- ============================================================ -->
  <!-- CORE foundation (wide band at the bottom)                    -->
  <!-- ============================================================ -->
  <g filter="url(#shadow)">
    <rect x="50" y="400" width="900" height="190" rx="14" fill="url(#g-core)" stroke="#7c3aed" stroke-width="1.5"/>
  </g>
  <rect x="50" y="400" width="900" height="28" rx="14" fill="#7c3aed"/>
  <rect x="50" y="414" width="900" height="14" fill="#7c3aed"/>
  <text x="64" y="418" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1.2">CORE</text>
  <text x="936" y="418" text-anchor="end" font-size="11" fill="#ede9fe">platform substrate · no upward dependencies</text>

  <g font-size="11.5" fill="#5b21b6">
    <rect x="64" y="440" width="288" height="60" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="208" y="462" text-anchor="middle" font-weight="600">models/</text>
    <text x="208" y="481" text-anchor="middle" font-size="10.5" fill="#6d28d9">AnnotationTable · ExpressionMatrix</text>
    <text x="208" y="494" text-anchor="middle" font-size="10.5" fill="#6d28d9">VariantMatrix · GeneSet</text>

    <rect x="360" y="440" width="288" height="60" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="504" y="462" text-anchor="middle" font-weight="600">io/</text>
    <text x="504" y="481" text-anchor="middle" font-size="10.5" fill="#6d28d9">save · load</text>
    <text x="504" y="494" text-anchor="middle" font-size="10.5" fill="#6d28d9">save_native · load_native</text>

    <rect x="656" y="440" width="290" height="60" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="801" y="462" text-anchor="middle" font-weight="600">plugin/</text>
    <text x="801" y="481" text-anchor="middle" font-size="10.5" fill="#6d28d9">registry · loader</text>
    <text x="801" y="494" text-anchor="middle" font-size="10.5" fill="#6d28d9">run_builder_for_spec</text>

    <rect x="64" y="510" width="436" height="64" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="282" y="532" text-anchor="middle" font-weight="600">Provenance · BuildContext</text>
    <text x="282" y="551" text-anchor="middle" font-size="10.5" fill="#6d28d9">required on every dataset</text>
    <text x="282" y="565" text-anchor="middle" font-size="10.5" fill="#6d28d9">parents chained automatically by @algorithm</text>

    <rect x="508" y="510" width="438" height="64" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="727" y="532" text-anchor="middle" font-weight="600">Expr DSL</text>
    <text x="727" y="551" text-anchor="middle" font-size="10.5" fill="#6d28d9">col(…) · agg_mean · agg_count · …</text>
    <text x="727" y="565" text-anchor="middle" font-size="10.5" fill="#6d28d9">compiles to hail or pandas at execution time</text>
  </g>

  <!-- Footer legend -->
  <g font-size="11" fill="#64748b">
    <line x1="60" y1="620" x2="86" y2="620" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="96" y="624">direct import</text>

    <path d="M196,614 L206,624 M206,614 L196,624" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/>
    <text x="214" y="624">no import: skills/ and algorithms/ meet only through core/</text>

    <text x="940" y="624" text-anchor="end">nothing imports upward</text>
  </g>
</svg>
