api_version: 2
name: alphagenome
version: 0.2.0
status: provisional
description: AlphaGenome variant-effect scores (SDK tidy_scores parquet) - Hail Table

source:
  catalog_ref: alphagenome

datasets:
  - name: predictions
    acquisition:
      mode: byo
      reason: credentialed
      instructions: SKILL.md#7-workflow-steps
    domain: genomics
    backend: hail
    artifact_type: AnnotationTable
    schema_id: alphagenome-v2
    builder:
      module: hvantk.skills.alphagenome.builder
      function: build_alphagenome_predictions
    drift_probe:
      module: hvantk.skills.alphagenome.drift_probe
      function: fetch_fingerprint
    skill: SKILL.md
    tests:
      command: pytest hvantk/skills/alphagenome/tests -m hail
      fixture: tests/testdata/raw/alphagenome
      schema_snapshot: tests/snapshots/schema.json
      row_snapshot: tests/snapshots/sample_rows.json
      drift_fingerprint: tests/drift_fingerprint.json
