api_version: 2
name: gwas-catalog
version: 0.1.0
status: provisional
description: NHGRI-EBI GWAS Catalog full associations TSV - Hail Table

catalog: catalog/datasets.json

source:
  catalog_ref: gwas-catalog

datasets:
  - name: associations
    domain: genomics
    backend: hail
    artifact_type: AnnotationTable
    schema_id: gwas-catalog-associations-v1
    builder:
      module: hvantk.skills.gwas_catalog.builder
      function: build_gwas_catalog_associations
    drift_probe:
      module: hvantk.skills.gwas_catalog.drift_probe
      function: fetch_fingerprint
    skill: SKILL.md
    tests:
      command: pytest hvantk/skills/gwas_catalog/tests -m hail
      fixture: tests/testdata/raw/gwas-catalog
      schema_snapshot: tests/snapshots/schema.json
      row_snapshot: tests/snapshots/sample_rows.json
      drift_fingerprint: tests/drift_fingerprint.json
