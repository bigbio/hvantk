api_version: 2
name: gevir
version: 0.1.0
status: provisional
description: GeVIR gene vulnerability and intolerance rank metrics - Hail Table

catalog: catalog/datasets.json

source:
  catalog_ref: gevir

datasets:
  - name: metrics
    domain: genomics
    backend: hail
    artifact_type: AnnotationTable
    schema_id: gevir-metrics-v1
    builder:
      module: hvantk.skills.gevir.builder
      function: build_gevir_metrics
    drift_probe:
      module: hvantk.skills.gevir.drift_probe
      function: fetch_fingerprint
    skill: SKILL.md
    tests:
      command: pytest hvantk/skills/gevir/tests -m hail
      # Shared fixture: lives in the repo-level testdata tree
      # (hvantk/tests/testdata/raw/gevir), used by this plugin's round-trip test and
      # by cross-cutting tests, so it is referenced in place rather than duplicated.
      # Resolved relative to this plugin folder -> ../../tests/... = hvantk/tests/...
      fixture: ../../tests/testdata/raw/gevir
      schema_snapshot: tests/snapshots/schema.json
      row_snapshot: tests/snapshots/sample_rows.json
      drift_fingerprint: tests/drift_fingerprint.json
