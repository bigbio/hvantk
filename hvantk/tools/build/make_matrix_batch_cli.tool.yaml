api_version: 1
name: mkmatrix-batch
domain: build
type: command
description: Build multiple MatrixTables / AnnData objects from a recipe.
cli:
  module: hvantk.tools.build.make_matrix_batch_cli
  function: mkmatrix_batch_cli
purpose:
  short: Build a batch of expression matrices described in a recipe file.
  long: |
    Reads a recipe file (JSON, or YAML if PyYAML is installed) with a top-level
    `matrices` list. Each entry specifies a registered matrix-builder name,
    an `inputs` dict, an output path, and optional params. Dispatches to
    `hvantk.tables.registry.run_matrix_builder` so multiple matrices can be
    staged in one invocation.
requires:
  hail: true
  network: false
