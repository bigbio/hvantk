api_version: 1
name: mktable-batch
domain: build
type: command
description: Build multiple Hail Tables from a JSON/YAML recipe.
cli:
  module: hvantk.tools.build.make_table_batch_cli
  function: mktable_batch_cli
purpose:
  short: Build a batch of annotation Hail Tables described in a recipe file.
  long: |
    Reads a recipe file (JSON, or YAML if PyYAML is installed) with a top-level
    `tables` list. Each entry specifies a registered builder name, an input
    path, an output path, and optional per-builder params. Dispatches to the
    table-builder registry in `hvantk.core.plugin.registry.run_table_builder` so
    a single recipe can stage many tables in one invocation.
requires:
  hail: true
  network: false
