api_version: 1
name: utils
domain: infra
type: command_group
description: Operational utilities (format conversion, validation, diagnostics).
cli:
  module: hvantk.tools.infra.utils_cli
  function: utils_group
purpose:
  short: Umbrella for infra commands wired under `hvantk utils`.
  long: |
    Re-exports a handful of infra commands as subcommands of `utils`:
    `check-install` (post-install Hail smoke test), `catalog` (artifact
    catalog list/show/build), and `validate-bgzf` / `convert-bgz` (file
    utilities). New infra commands can be added with one `add_command`
    line in `utils_cli.py`.
subcommands:
  - name: check-install
    description: Post-install smoke test (proxy + Hail + synthetic MT)
  - name: catalog
    description: Inspect and invoke hvantk artifact catalog entries
  - name: validate-bgzf
    description: Validate BGZF block integrity of BGZF-compressed files
  - name: convert-bgz
    description: Convert standard gzip (.gz) files to block gzip (.bgz)
requires:
  hail: true
  network: false
