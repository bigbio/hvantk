api_version: 1
name: annotate-features
domain: annotation
type: command
description: Annotate a variant Hail Table with features from multiple sources.
cli:
  module: hvantk.tools.annotation.annotate_features
  function: main
purpose:
  short: Sequentially annotate a variant Hail Table with curated features.
  long: |
    Reads a variant Hail Table keyed by locus + alleles plus a gene-symbol
    column and annotates it in sequence with ClinVar significance, variant
    IDs, Ensembl gene IDs, CCR, GeVIR, RNA-seq expression, gnomAD AF, gnomAD
    constraint metrics, interactome PPI sites, HCA, and dbNSFP deleterious
    scores. Currently invoked as a standalone script (argparse) rather than
    being wired into the top-level `hvantk` Click CLI.
requires:
  hail: true
  network: false
