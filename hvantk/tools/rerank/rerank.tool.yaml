api_version: 1
name: rerank
domain: rerank
type: command
description: Re-rank genes by multi-omic credibility from a declarative YAML config.
cli:
  module: hvantk.tools.rerank
  function: rerank_cmd
purpose:
  short: Calibrated credibility re-ranking of a gene burden by multi-omic feature tables.
  long: |
    Given a YAML config naming a cohort manifest (the prior/gene burden, and,
    when it declares an architecture axis, the columns enabling the advisory
    architecture/QC audit), one or more gene-keyed feature tables (constraint,
    expression, ...), and a label gene-list, `rerank` fits a calibrated
    out-of-fold model, assigns credibility tiers, and flags cohort artifacts
    for review (advisory, not overriding), reporting per-axis delta-AUC over
    the constraint baseline. The disease-specific feature tables are produced
    by user recipes; the engine is disease-agnostic.

    Three controls decide whether a reported gain is real, and all three are
    opt-in flags. `--blocks` switches cross-validation to paralogue-blocked
    folds (HGNC primary `gene_group`) so a gene family cannot straddle a fold,
    and aborts when one block exceeds `--max-block-frac` of the universe.
    `--n-perm` builds the per-axis and selected-maximum permutation nulls, the
    latter being the multiplicity correction for having searched several axes
    and reported the best; the API separately supports chunked nulls
    (`NullConfig(chunk=, n_chunks=)` + `NullDistribution.merge`) for cluster
    array jobs. `--seed` and `--seed-sweep` make the CV partition a parameter
    and report the across-seed spread beside the gene-resampling interval.
requires:
  hail: false
  network: false
