[tool.poetry]
name = "hvantk"
version = "0.1.0"
description = "Hail-based toolkit for multi-omics variant annotation and analysis"
authors = ["Yasset Perez-Riverol <ypriverol@gmail.com>",
           "Enrique Audain <enrique.audain@uni-oldenburg.de>"]
license = "MIT"
readme = "README.md"
keywords = [
    "multiomics",
    "annotation-toolkit",
    "data-analysis",
    "big data",
    "genotype-combining",
    "joint-genotyping"
]
include = [
  { path = "hvantk/skills/**/plugin.yaml", format = ["sdist", "wheel"] },
  { path = "hvantk/skills/**/*.py", format = ["sdist", "wheel"] },
  { path = "hvantk/skills/**/SKILL.md", format = ["sdist", "wheel"] },
  { path = "hvantk/skills/**/catalog/*.json", format = ["sdist", "wheel"] },
  { path = "hvantk/skills/**/tests/drift_fingerprint.json", format = ["sdist", "wheel"] },
  { path = "hvantk/algorithms/**/resources/*.R", format = ["sdist", "wheel"] },
]
exclude = [
    "hvantk/skills/**/tests/test_*.py",
    "hvantk/skills/**/tests/conftest.py",
    "hvantk/skills/**/tests/__init__.py",
    "hvantk/skills/**/tests/data/**",
    "hvantk/skills/**/tests/snapshots/**",
    "hvantk/skills/**/tests/fixtures/**",
]

[tool.poetry.dependencies]
python = ">=3.10.0,<4.0.0"
hail = ">=0.2.137"
click = "^8.1.3"
requests = "*"
tqdm = "*"
pandas = "^2.0.0"
pyarrow = ">=14.0"
PyYAML = "*"
jsonschema = ">=4.0"
psutil = "*"
pysam = ">=0.22"
certifi = "*"
anndata = ">=0.10.0"
scanpy = ">=1.10.0"
gnomad = { version = "*", optional = true }
scikit-learn = { version = "^1.3.0", optional = true }
matplotlib = { version = "*", optional = true }
seaborn = { version = "*", optional = true }
plotly = { version = "*", optional = true }
duckdb = { version = ">=0.9.0", optional = true }
cptac = { version = "*", optional = true }
tspex = { version = ">=0.6.0", optional = true }

[tool.poetry.extras]
viz = ["matplotlib", "seaborn", "plotly"]
duckdb = ["duckdb"]
interactive = ["plotly"]
hgc = ["matplotlib", "seaborn", "plotly", "gnomad"]
psroc = ["matplotlib", "plotly", "scikit-learn"]
ptm = ["cptac"]
constraint = ["tspex", "matplotlib", "seaborn"]
ancestry = ["scikit-learn", "matplotlib", "seaborn"]
ml = ["scikit-learn"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
requests-mock = "^1.11"
flake8 = "^6.0.0"
black = "^23.7.0"
hypothesis = ">=6.0"
matplotlib = "*"
seaborn = "*"
plotly = "*"
tspex = "*"
scikit-learn = "*"
mkdocs = "*"
mkdocs-material = "*"
ipykernel = "^7.2.0"

[tool.poetry.plugins."hvantk.providers"]
# In-tree plugins register themselves the same way as external ones.
# Only providers migrated to the plugin layout appear here.
hgnc = "hvantk.skills.hgnc"
msigdb = "hvantk.skills.msigdb"
gtex-eqtl = "hvantk.skills.gtex_eqtl"
gwas-catalog = "hvantk.skills.gwas_catalog"
insider = "hvantk.skills.insider"
clinvar = "hvantk.skills.clinvar"
expression-atlas = "hvantk.skills.expression_atlas"
peptideatlas = "hvantk.skills.peptideatlas"
cptac = "hvantk.skills.cptac"
ucsc-cellbrowser = "hvantk.skills.ucsc_cellbrowser"
clingen = "hvantk.skills.clingen"
gencc = "hvantk.skills.gencc"
uniprot-ptm = "hvantk.skills.uniprot_ptm"

[tool.pytest.ini_options]
testpaths = ["hvantk/tests", "hvantk/skills"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
GitHub = "https://github.com/bigbio/hvantk/"
LICENSE = "https://github.com/bigbio/hvantk/blob/main/LICENSE"

[tool.poetry.scripts]
hvantk = "hvantk.hvantk:main"
