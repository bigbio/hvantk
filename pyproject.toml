[tool.poetry]
name = "hvantk"
version = "0.1.0"
description = "Hail-based multiomics variant annotation toolkit."
authors = ["Yasset Perez-Riverol <ypriverol@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
hail = "~=0.2.120"
click = "~=8.1.7"
requests = "~=2.31.0"
tqdm = "~=4.67.1"
pandas = "^1.5"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
flake8 = "^4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"