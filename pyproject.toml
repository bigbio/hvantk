[tool.poetry]
name = "hvantk"
version = "0.1.0"
description = "Hail-based toolkit for multi-omics variant annotation and analysis"
authors = ["Yasset Perez-Riverol <ypriverol@gmail.com>",
           "Enrique Audain <enrique.audain@uni-oldenburg.de>"]
license = "MIT"
readme = "README.md"
keywords = [
    "multiomics",
    "annotation-toolkit",
    "data-analysis",
    "big data",
    "genotype-combining",
    "joint-genotyping"
]
include = [
  { path = "hvantk/resources/catalog.yaml", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.10.0,<4.0.0"
hail = ">=0.2.132"
click = "^8.1.3"
requests = "*"
tqdm = "*"
pandas = "^2.0.0"
PyYAML = "*"
psutil = "*"
pysam = ">=0.22"
gnomad = { version = "*", optional = true }
scikit-learn = "^1.3.0"
matplotlib = { version = "*", optional = true }
seaborn = { version = "*", optional = true }
plotly = { version = "*", optional = true }

[tool.poetry.extras]
viz = ["matplotlib", "seaborn", "plotly"]
interactive = ["plotly"]
hgc = ["matplotlib", "seaborn", "plotly", "gnomad"]
psroc = ["matplotlib", "plotly"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
flake8 = "^6.0.0"
black = "^23.7.0"
matplotlib = "*"
seaborn = "*"
plotly = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
GitHub = "https://github.com/bigbio/hvantk/"
LICENSE = "https://github.com/bigbio/hvantk/blob/main/LICENSE"

[tool.poetry.scripts]
hvantk = "hvantk.hvantk:main"
