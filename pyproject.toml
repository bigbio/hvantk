# PEP 621 metadata. Migrated off the `[tool.poetry.*]` spelling 2026-08-04, which poetry 2.x
# reported as 11 deprecation warnings on every `poetry check`. The migration had to come
# first: the `poetry>=2.0,<3.0` pin in the lockfile CI job was defensive against a future
# major promoting those warnings to errors, and that pin can only be relaxed once nothing
# deprecated is left. Poetry-specific keys (include/exclude, dependency groups) stay under
# [tool.poetry] -- they have no PEP 621 equivalent and are not deprecated.
[project]
name = "hvantk"
version = "0.3.1"
description = "Hail-based toolkit for multi-omics variant annotation and analysis"
authors = [
    { name = "Yasset Perez-Riverol", email = "ypriverol@gmail.com" },
    { name = "Enrique Audain", email = "enrique.audain@uni-oldenburg.de" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10.0,<4.0.0"
keywords = [
    "multiomics",
    "annotation-toolkit",
    "data-analysis",
    "big data",
    "genotype-combining",
    "joint-genotyping"
]
# PEP 508 specifiers, so poetry's caret shorthand is spelled out. These are exact
# equivalents, not re-pins: ^8.1.3 == >=8.1.3,<9.0.0 and ^2.0.0 == >=2.0.0,<3.0.0. The lock
# resolves to the same 187 packages as before the migration.
dependencies = [
    "hail>=0.2.137",
    "click>=8.1.3,<9.0.0",
    "requests",
    "tqdm",
    "pandas>=2.0.0,<3.0.0",
    # Imported at module scope in ~68 modules. It has always arrived transitively via
    # pandas/hail, but code that imports a package directly should declare it -- otherwise
    # the day pandas drops or re-pins numpy, the break surfaces somewhere unrelated.
    "numpy>=1.23",
    "pyarrow>=14.0",
    "PyYAML",
    "jsonschema>=4.0",
    "psutil",
    "pysam>=0.22",
    "certifi",
    "anndata>=0.10.0",
    # Imported at module scope by skills/ucsc_cellbrowser/shared/ucsc.py, reached from
    # `hvantk expression summarize-ucsc` and the ucsc builder. It always arrived
    # transitively via anndata (which requires h5py>=3.7), which is exactly why nothing
    # noticed it was declared nowhere (#363). Same floor as anndata's own requirement.
    "h5py>=3.7",
    # Imported at module scope by the same ucsc.py (`from scipy import sparse`), on the same
    # base-install-reachable path -- yet scipy was declared only in seven extras, none of
    # which gate `summarize-ucsc` or the ucsc builder. It always arrived transitively via
    # anndata (which requires scipy unconditionally), which is exactly why nothing
    # noticed a base-reachable command could need an undeclared-at-base package (#376). Also
    # imported at module scope by algorithms/{ptm/constraint,enrichex/overlap,burden/fet,
    # visualization/expression/anndata}.py.
    "scipy>=1.8",
]

[project.urls]
GitHub = "https://github.com/bigbio/hvantk/"
LICENSE = "https://github.com/bigbio/hvantk/blob/main/LICENSE"

[project.scripts]
hvantk = "hvantk.hvantk:main"

[tool.poetry]
include = [
  { path = "hvantk/skills/**/plugin.yaml", format = ["sdist", "wheel"] },
  { path = "hvantk/skills/**/SKILL.md", format = ["sdist", "wheel"] },
  { path = "hvantk/skills/**/catalog/*.json", format = ["sdist", "wheel"] },
  # multi-dataset providers suffix this per dataset (drift_fingerprint_samples.json)
  { path = "hvantk/skills/**/tests/drift_fingerprint*.json", format = ["sdist", "wheel"] },
]
# These excludes were previously defeated and shipped 43.3 MB of test data in a 46.2 MB
# wheel -- 339 files under a tests/ dir, including a 14.7 MB VDS zip and an 11.4 MB
# expression-atlas fixture. Two causes, both fixed here:
#   1. `hvantk/tests/**` was never listed at all (190 of those files), so the top-level test
#      suite and its testdata/ shipped to every user in full.
#   2. The skills excludes were overridden by the explicit `include` of
#      "hvantk/skills/**/*.py" above: a path named by `include` wins, so test_*.py under a
#      skill came back in regardless of being excluded. The include is now narrowed to the
#      non-.py data files it exists for -- ordinary package modules under hvantk/ need no
#      include, since `packages` already carries them.
# Nothing in CI built a wheel, so none of this was visible. The packaging-smoke job added in
# this change asserts wheel hygiene so it cannot regress silently again.
exclude = [
    "hvantk/tests/**",
    "hvantk/skills/**/tests/test_*.py",
    "hvantk/skills/**/tests/conftest.py",
    "hvantk/skills/**/tests/__init__.py",
    "hvantk/skills/**/tests/data/**",
    "hvantk/skills/**/tests/testdata/**",
    "hvantk/skills/**/tests/snapshots/**",
    "hvantk/skills/**/tests/fixtures/**",
]
# `testdata` (above) was the name actually used by the skills; the pre-existing list named
# only data/, snapshots/ and fixtures/, so per-skill fixture VCF/TSV/parquet files shipped.
# drift_fingerprint.json stays -- it is included on purpose, being what `hvantk drift`
# compares a live probe against.

# Optional dependencies. In PEP 621 an extra carries the full specifier, so a constraint
# repeated across extras (scikit-learn in three) is a drift surface that the old
# [tool.poetry.dependencies] + [tool.poetry.extras] split did not have -- one extra could
# be re-pinned and the others left behind, silently. test_pyproject_extras.py asserts every
# extra spells the same package identically, so that divergence fails the build.
#
# scipy moved to [project.dependencies] (#376): it used to be split across seven extras by
# call graph (ptm/constraint.py, enrichex/overlap.py, burden/fet.py and
# visualization/expression/anndata.py each import it at module scope, on four different
# commands), but skills/ucsc_cellbrowser/shared/ucsc.py imports scipy.sparse at module scope
# on a path no extra gates (`hvantk expression summarize-ucsc`, reachable from a base
# install), so extras-only placement was never actually sound. anndata already requires
# scipy unconditionally, so the promotion changes no resolution. `cohort` had no other
# member and is kept as an empty extra so `pip install hvantk[cohort]` keeps working.
#
# scikit-learn floor is >=1.4, not >=1.3: rerank's opt-in RFECV step wraps
# RandomForestClassifier, which only tolerates NaN from 1.4 onward, and these feature
# matrices are 20-50% missing by design.
#
# scanpy is optional, unlike anndata: it pulls numba -> llvmlite, which ships no x86_64 macOS
# wheel from 0.47 on, so a base-level declaration would make the package uninstallable on
# Intel Macs -- including for the ~99% of the toolkit that never touches expression.
#
# sorted-nearest is a compiled runtime dep of pyranges (imported by cptac); an extras install
# doesn't reliably pull it, so it is declared explicitly. Import name is `sorted_nearest`.
[project.optional-dependencies]
viz = ["matplotlib", "seaborn", "plotly"]
duckdb = ["duckdb>=0.9.0"]
interactive = ["plotly"]
hgc = ["matplotlib", "seaborn"]
psroc = ["matplotlib", "plotly", "scikit-learn>=1.4,<2.0"]
ptm = ["cptac", "sorted-nearest"]
# statsmodels is needed at call time by algorithms/ptm/lmm.py ("PTM
# constraint tests"), reached from `hvantk ptm test`. It was declared in no dependency
# set at all until #318, so a fresh install raised ModuleNotFoundError on that path --
# invisible because ptm_cli imports lmm lazily, inside the command body, so `--help`
# and every other subcommand kept working.
constraint = ["tspex>=0.6.0", "matplotlib", "seaborn", "statsmodels>=0.14"]
# enrichex's eager import need is now covered by the base scipy dependency -- overlap.py
# imports scipy.stats at module scope, so `hvantk enrichex overlap` needs it to import at
# all (#376). matplotlib stays in this extra: enrichex/__init__ resolves plot.py / report.py
# through a PEP 562 __getattr__, so a base install can run the CLI, and only the plotting
# and --generate-report paths need matplotlib at call time, raising an ImportError naming
# this extra if it is missing.
enrichex = ["matplotlib", "seaborn"]
# cohort covered `hvantk cohort burden`, whose pipeline reaches algorithms/burden/fet.py and
# its module-scope `from scipy.stats import fisher_exact` -- scipy alone, since nothing on
# that path imports matplotlib. scipy is now a base dependency (#376), so this extra has no
# packages left; kept as an empty list (rather than removed) so `pip install hvantk[cohort]`
# / `poetry install --extras cohort` keep working for anyone already using them.
cohort = []
ancestry = ["scikit-learn>=1.4,<2.0", "matplotlib", "seaborn"]
ml = ["scikit-learn>=1.4,<2.0"]
# scipy moved to [project.dependencies] (#376); scanpy already depended on it too, so this
# extra now only needs to add scanpy itself.
expression = ["scanpy>=1.10.0"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
requests-mock = "^1.11"
ruff = "^0.16"
hypothesis = ">=6.0"
matplotlib = "*"
seaborn = "*"
plotly = "*"
tspex = "*"
scikit-learn = "*"
mkdocs = "*"
mkdocs-material = "*"
ipykernel = "^7.2.0"

[project.entry-points."hvantk.providers"]
# In-tree plugins register themselves the same way as external ones.
# Only providers migrated to the plugin layout appear here.
hgnc = "hvantk.skills.hgnc"
msigdb = "hvantk.skills.msigdb"
gtex-eqtl = "hvantk.skills.gtex_eqtl"
gwas-catalog = "hvantk.skills.gwas_catalog"
insider = "hvantk.skills.insider"
clinvar = "hvantk.skills.clinvar"
expression-atlas = "hvantk.skills.expression_atlas"
peptideatlas = "hvantk.skills.peptideatlas"
cptac = "hvantk.skills.cptac"
ucsc-cellbrowser = "hvantk.skills.ucsc_cellbrowser"
clingen = "hvantk.skills.clingen"
gencc = "hvantk.skills.gencc"
uniprot-ptm = "hvantk.skills.uniprot_ptm"

[tool.ruff]
# Replaces flake8 (same enforced rule set, ~60x faster). Formatting is
# `ruff format`, black-compatible, at black's default width -- the width the
# already-formatted files in this repo already follow. `black` itself is gone
# (dev dependency, dropped below).
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# The advisory set. A bare `ruff check` (or a ruff-LSP editor) reports what CI's
# advisory pass reports; CI narrows to E9,F63,F7,F82 with an explicit --select
# for the one gate that actually blocks a merge.
#
# B (bugbear), BLE (blind-except) and S (bandit) are new here so the existing
# `# noqa: BLE001` / `# noqa: S310` / `# noqa: S324` comments actually suppress
# something.
#
# CI's advisory pass additionally runs with --preview, which restores the
# pycodestyle whitespace rules (E1/E2/E3, W29x) that ruff keeps behind preview.
# `preview` is deliberately NOT set here, in the config: under preview the
# *blocking* gate also fires F822 on every name that ptm/, enrichex/ and
# qtlcascade/ export lazily through `__all__` (83 false positives).
select = ["E", "W", "F", "C901", "B", "BLE", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 127  # advisory E501 threshold; independent of the formatter width above

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test.
"hvantk/tests/**" = ["S101"]
"hvantk/skills/**/tests/**" = ["S101"]

[tool.ruff.format]
# Python files only. ruff also formats the Python fences inside Markdown, where it
# reflows examples and pseudo-schemas laid out by hand for the reader (e.g. the
# fingerprint shape in _conventions/SKILL.md).
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["hvantk/tests", "hvantk/skills"]

[build-system]
# >=2.0, not >=1.0: PEP 621 `[project]` metadata is only read by poetry-core 2.x, and the
# `license = "MIT"` SPDX expression needs its PEP 639 support. Against an older poetry-core
# this file's name/version/dependencies would simply not be found, since [tool.poetry] no
# longer carries them -- a build that fails, or worse produces a wheel with empty metadata.
# The floor was left at 1.0.0 through the migration and only caught in review; CI masked it
# because the packaging-smoke job installs a modern poetry explicitly.
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
