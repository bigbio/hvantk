site_name: hvantk
site_description: Hail-based toolkit for multi-omics variant annotation and analysis
site_url: https://bigbio.github.io/hvantk
repo_url: https://github.com/bigbio/hvantk
repo_name: bigbio/hvantk
edit_uri: edit/dev/docs_site/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

# Without this, `mkdocs build --strict` still passes on a broken anchor or an
# unresolvable internal link -- both default to INFO, and --strict only promotes
# WARNINGs. The docs CI job relies on these being warnings.
validation:
  links:
    anchors: warn
    unrecognized_links: warn
    absolute_links: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

docs_dir: docs_site

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Quick start: getting-started/quickstart.md
  - User guide:
    - Building datasets: guide/usage.md
    - Data sources: guide/data-sources.md
    - Running on HPC: guide/hpc-migration.md
    - Workflow skills: guide/workflow-skills.md
  - Tools:
    - HGC (joint genotyping): tools/hgc.md
    - Ancestry inference: tools/ancestry.md
    - Gene annotation matrix: tools/annotate.md
    - External cohorts: tools/cohort.md
    - Re-rank: tools/rerank.md
    - EnrichEx (enrichment and burden): tools/enrichex.md
    - Gene sets: tools/genesets.md
    - PS-ROC (score evaluation): tools/psroc.md
    - PTM: tools/ptm.md
    - PTM constraint: tools/ptm-constraint.md
    - QTL cascade: tools/qtlcascade.md
    - Expression analysis: tools/expression.md
  - Examples:
    - Overview: examples/index.md
    - HGC: examples/hgc.md
    - Ancestry: examples/ancestry.md
    - Re-rank: examples/rerank.md
    - EnrichEx: examples/enrichex.md
    - PS-ROC: examples/psroc.md
    - PTM: examples/ptm.md
    - QTL cascade: examples/qtlcascade.md
    - ClinVar streaming: examples/clinvar.md
    - ClinGen: examples/clingen.md
  - Architecture: architecture.md
  - Contributing: contributing.md
