name: hvantk
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10,<3.13
  - openjdk=11  # Required for Spark/Hail
  - pip
  - pip:
      - click
      - hail==0.2.137  # Pin exact version for Spark compatibility
      - pyspark==3.5.7  # Must match Hail's compiled Spark version
      - gnomad
      - requests
      - tqdm
      - pandas
      - pyarrow>=14  # parquet engine for AnnotationTable(backend="pandas") via core/io
      - numpy
      - matplotlib
      - seaborn
      - anndata>=0.10.0
      - scanpy>=1.10.0
      - pysam>=0.22
      - PyYAML
      - psutil
      - scikit-learn
      - tspex
      - requests-mock  # offline HTTP stubs for plugin drift_probe tests
      - jsonschema>=4.0  # plugin.yaml + feature-spec validation (matches pyproject >=4.0)
