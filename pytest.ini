[pytest]
addopts = -m "not slow and not network and not hail and not integration and not round_trip_contract" -q
testpaths =
    hvantk/tests
    hvantk/skills
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that perform network I/O
    hail: marks tests that require Hail/Spark
    integration: marks tests as integration tests
    round_trip(dataset): the round-trip test of a plugin dataset ("<provider>:<dataset>")
    round_trip_contract: the slow per-manifest round-trip collection check (deselected by default; CI opts in with -m)
