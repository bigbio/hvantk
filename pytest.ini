[pytest]
addopts = -m "not slow and not network and not hail and not integration and not llm" -q
testpaths =
    hvantk/tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that perform network I/O
    hail: marks tests that require Hail/Spark
    integration: marks tests as integration tests
    llm: marks tests that require LLM providers or related heavy mocks
