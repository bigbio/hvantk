[pytest]
addopts = -m "not slow and not network and not hail and not integration" -q
testpaths =
    hvantk/tests
    hvantk/skills
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that perform network I/O
    hail: marks tests that require Hail/Spark
    integration: marks tests as integration tests
